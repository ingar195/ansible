---
- name: Install parted
  ansible.builtin.apt:
    name: parted
    state: present

# Terraform's second VM disk, scsi1 -- addressed by-id, NOT /dev/sdb: SCSI
# enumeration order isn't stable across reboots, so /dev/sdX can flip to the
# boot disk instead.
- name: Partition the data disk
  community.general.parted:
    device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    number: 1
    state: present
    fs_type: ext4

- name: Format the data partition
  community.general.filesystem:
    fstype: ext4
    dev: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1

- name: Mount the data disk at /data
  ansible.posix.mount:
    path: /data
    src: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1-part1
    fstype: ext4
    state: mounted

- name: Create data directories for the monitoring compose stack
  ansible.builtin.file:
    path: "/data/{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}" # each image's default non-root uid, so the container can write without running as root
    mode: '0755'
  loop:
    - { path: prometheus, owner: "65534" } # nobody, prom/prometheus default
    - { path: loki, owner: "10001" } # grafana/loki default
    - { path: grafana, owner: "472" } # grafana/grafana default

