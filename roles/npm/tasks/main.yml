---
- name: Install nfs-common (needed for Docker's NFS volume driver)
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: npm_nfs_server is defined

- name: Allow NPM ports (80/443 public, 81 admin UI)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ npm_ports }}"

# Deployment (compose file, container lifecycle) and proxy host/cert config
# are both owned by Komodo/NPM's own UI now, git-synced from
# github.com/ingar195/komodo-stacks-dmz -- this role only opens the ports.
