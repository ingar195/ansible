---
- name: Allow NPM ports (80/443 public, 81 admin UI)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ npm_ports }}"

# Deployment (compose file, container lifecycle) is owned by Komodo, synced
# from github.com/ingar195/compose (proxymanager/). Data lives on this VM's
# disk in /opt/docker/npm and is covered by the Proxmox/PBS VM backup. This
# role only opens the ports.
