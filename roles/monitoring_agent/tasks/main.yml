---
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install python3-debian (needed by deb822_repository)
  apt:
    name: python3-debian
    state: present

- name: Download Grafana GPG key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
    force: true

- name: Add Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Alloy
  apt:
    name: alloy
    state: present
    update_cache: yes

- name: Create Alloy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: '0755'

- name: Run Alloy as root (prometheus.exporter.cadvisor needs the containerd
    socket, which is root:root with no group access, plus full /proc/cgroup
    access -- standard requirement for this class of tool, same as why the
    official standalone cadvisor container always runs privileged/root)
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/override.conf
    content: |
      [Service]
      User=root
      Group=root
    mode: '0644'
  notify: Restart Alloy

- name: Disable Alloy usage reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting"'
  notify: Restart Alloy

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check whether Docker is installed (decides if the docker log source is rendered)
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: monitoring_agent_docker_bin

- name: Create the textfile collector directory (Alloy config references it on every host)
  ansible.builtin.file:
    path: "{{ monitoring_agent_textfile_dir }}"
    state: directory
    mode: '0755'

- name: Install smartmontools and jq (SMART metrics, physical hosts only)
  ansible.builtin.apt:
    name: [smartmontools, jq]
    state: present
  when: monitoring_agent_smart_enabled | bool

- name: Install the SMART metrics script
  ansible.builtin.copy:
    src: smart-textfile.sh
    dest: /usr/local/bin/smart-textfile.sh
    mode: '0755'
  when: monitoring_agent_smart_enabled | bool

- name: Install the SMART metrics service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: '0644'
  loop:
    - name: smart-textfile.service
      content: |
        [Unit]
        Description=Write SMART metrics for Alloy

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/smart-textfile.sh
    - name: smart-textfile.timer
      content: |
        [Unit]
        Description=Write SMART metrics every 10 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=10min

        [Install]
        WantedBy=timers.target
  when: monitoring_agent_smart_enabled | bool

- name: Enable the SMART metrics timer
  ansible.builtin.systemd:
    name: smart-textfile.timer
    state: started
    enabled: true
    daemon_reload: true
  when: monitoring_agent_smart_enabled | bool
  # --check only simulates the unit files above, so the timer can't be found yet
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy Alloy config
  template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'
  notify: Restart Alloy

- name: Ensure Alloy is started and enabled
  service:
    name: alloy
    state: started
    enabled: yes
