---
- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install python3-debian (needed by deb822_repository)
  apt:
    name: python3-debian
    state: present

- name: Download Grafana GPG key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
    force: true

- name: Add Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
    state: present

- name: Install Alloy
  apt:
    name: alloy
    state: present
    update_cache: yes

- name: Create Alloy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: '0755'

- name: Run Alloy as root (prometheus.exporter.cadvisor needs the containerd
    socket, which is root:root with no group access, plus full /proc/cgroup
    access -- standard requirement for this class of tool, same as why the
    official standalone cadvisor container always runs privileged/root)
  ansible.builtin.copy:
    dest: /etc/systemd/system/alloy.service.d/override.conf
    content: |
      [Service]
      User=root
      Group=root
    mode: '0644'
  notify: Restart Alloy

- name: Disable Alloy usage reporting
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--disable-reporting"'
  notify: Restart Alloy

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Check whether Docker is installed (decides if the docker log source is rendered)
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: monitoring_agent_docker_bin

- name: Deploy Alloy config
  template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: '0644'
  notify: Restart Alloy

- name: Ensure Alloy is started and enabled
  service:
    name: alloy
    state: started
    enabled: yes
