---
- name: Install prerequisite packages
  apt:
    name:
      - gnupg
      - apt-transport-https
      - lsb-release
      - curl
      - sysvinit-utils
      - net-tools
      - rsyslog
    state: present

- name: Ensure rsyslog started and enabled
  service:
    name: rsyslog
    state: started
    enabled: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Wazuh GPG Key
  get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /etc/apt/keyrings/wazuh.asc
    mode: '0644'
    force: true

- name: Add Wazuh Repository
  ansible.builtin.deb822_repository:
    name: wazuh
    types: deb
    uris: https://packages.wazuh.com/4.x/apt/
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/wazuh.asc
    state: present

- name: Install Wazuh Agent
  apt:
    name: wazuh-agent
    state: present
    update_cache: yes

- name: Configure Manager IP in ossec.conf
  replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*?</address>'
    replace: '<address>{{ wazuh_manager_ip }}</address>'
  notify: Restart Wazuh Agent

- name: Ensure Wazuh Agent is started and enabled
  service:
    name: wazuh-agent
    state: started
    enabled: yes

- name: Download Microsoft GPG key
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /usr/share/keyrings/microsoft.gpg
    mode: '0644'

- name: Add Microsoft Repository (Debian 12)
  ansible.builtin.deb822_repository:
    name: microsoft-prod
    types: deb
    uris: https://packages.microsoft.com/debian/12/prod
    suites: bookworm
    components: main
    architectures: amd64
    signed_by: /usr/share/keyrings/microsoft.gpg
    state: present

- name: Install Sysmon for Linux
  apt:
    name: 
      - sysmonforlinux
    state: present
    update_cache: yes

- name: Check Sysmon service status
  ansible.builtin.systemd:
    name: sysmon
  register: sysmon_service_check

- name: Initialize Sysmon if not installed/active
  ansible.builtin.command:
    cmd: sysmon -i -accepteula
  when: sysmon_service_check.status.ActiveState != 'active'
  changed_when: true

- name: Ensure Sysmon is enabled
  ansible.builtin.systemd:
    name: sysmon
    enabled: true
    state: started

# Sysmon is very high-volume (~10 GB/day on a busy Proxmox node). logrotate
# rejects a log listed in two files ("duplicate log entry") and keeps the first,
# so take syslog/user.log out of the stock rsyslog config and own them here.
- name: Remove the superseded rsyslog-size-cap logrotate file
  ansible.builtin.file:
    path: /etc/logrotate.d/rsyslog-size-cap
    state: absent

- name: Remove syslog/user.log from the stock rsyslog logrotate config
  ansible.builtin.replace:
    path: /etc/logrotate.d/rsyslog
    regexp: '^/var/log/(syslog|user\.log)\n'
    replace: ''

- name: Rotate syslog/user.log by size
  ansible.builtin.copy:
    dest: /etc/logrotate.d/rsyslog-sysmon
    mode: '0644'
    content: |
      /var/log/syslog
      /var/log/user.log
      {
          size {{ syslog_rotate_size_mb }}M
          rotate {{ syslog_rotate_count }}
          compress
          delaycompress
          missingok
          notifempty
          sharedscripts
          postrotate
              systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
          endscript
      }

# One-off cleanup of the pre-fix backlog (a node had 41 GB of syslog/user.log).
# The thresholds scale with the rotate size and sit above what healthy rotation
# produces, so this no-ops once the logs are healthy: a plain (delaycompress)
# .1 can reach ~2x the size, a compressed one ~0.4x. At the 500M default that
# is 1200m / 200m.
- name: Find oversized uncompressed rotated syslog/user.log
  ansible.builtin.find:
    paths: /var/log
    patterns: '^(syslog|user\.log)\.[0-9]+$'
    use_regex: true
    size: "{{ (syslog_rotate_size_mb * 2.4) | int }}m"
  register: huge_rotated_plain

- name: Find oversized compressed rotated syslog/user.log
  ansible.builtin.find:
    paths: /var/log
    patterns: '^(syslog|user\.log)\.[0-9]+\.gz$'
    use_regex: true
    size: "{{ (syslog_rotate_size_mb * 0.4) | int }}m"
  register: huge_rotated_gz

- name: Delete oversized rotated syslog/user.log
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ huge_rotated_plain.files + huge_rotated_gz.files }}"
  loop_control:
    label: "{{ item.path }} ({{ (item.size / 1048576) | int }} MB)"

# Truncate in place (rsyslog appends, so its open handle stays valid) rather
# than force-rotate, which would gzip a huge file only to be deleted.
- name: Find oversized live syslog/user.log
  ansible.builtin.find:
    paths: /var/log
    patterns: '^(syslog|user\.log)$'
    use_regex: true
    size: "{{ syslog_rotate_size_mb * 2 }}m"
  register: huge_live_logs

- name: Truncate oversized live syslog/user.log
  ansible.builtin.command: truncate -s 0 {{ item.path }}
  loop: "{{ huge_live_logs.files }}"
  loop_control:
    label: "{{ item.path }} ({{ (item.size / 1048576) | int }} MB)"
  changed_when: true

# logrotate only runs daily by default, so a size limit alone lets the log grow
# for a whole day; run it hourly.
- name: Create logrotate.timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/logrotate.timer.d
    state: directory
    mode: '0755'

- name: Run logrotate hourly
  ansible.builtin.copy:
    dest: /etc/systemd/system/logrotate.timer.d/hourly.conf
    mode: '0644'
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=hourly
  register: logrotate_hourly

- name: Reload systemd and restart logrotate timer
  ansible.builtin.systemd:
    name: logrotate.timer
    daemon_reload: true
    state: restarted
    enabled: true
  when: logrotate_hourly.changed

