---
# Proxmox/PBS hosts (ansible_user=root, see hosts.ini) are a different
# security model entirely -- root login directly, no sudo, no cloud-init
# NOPASSWD grant to fix. These two tasks are only for cloud-init VMs.
- name: Set a real sudo password for the ansible user
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    password: "{{ fleet_sudo_password | password_hash('sha512', ansible_hostname | regex_replace('[^A-Za-z0-9./]', '')) }}"
  tags: [always]
  when: ansible_user != 'root'

- name: Require a password for sudo (cloud-init writes NOPASSWD:ALL fresh on
    every VM clone/recreate -- this re-locks it down on every run so a
    freshly (re)created VM never sits passwordless-admin for long)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-cloud-init-users
    content: |
      # Managed by roles/common -- do not hand-edit, cloud-init and this
      # role will both fight you. See that role's tasks for why this exists.
      {{ ansible_user }} ALL=(ALL:ALL) ALL
    mode: '0440'
    validate: 'visudo -cf %s'
  tags: [always]
  when: ansible_user != 'root'

- name: Ensure a DNS resolver is configured
  lineinfile:
    path: /etc/resolv.conf
    line: "nameserver {{ ansible_facts['default_ipv4']['gateway'] }}"
    create: yes
    mode: '0644'
  tags: [always]

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [update, always]

- name: Install common packages
  apt:
    name:
      - python3
      - htop
      - git
      - curl
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
    state: present
  tags: [setup, packages]

- name: Enable unattended-upgrades
  ansible.builtin.debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    value: "true"
    vtype: boolean

- name: Turn on the daily unattended-upgrades run
  # The debconf answer alone doesn't create this file, so the apt-daily-upgrade
  # timer fired every day but did nothing.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

- name: Setup unattended-upgrades config
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
  notify: Restart unattended-upgrades

- name: Upgrade all packages
  apt:
    upgrade: full
    force_apt_get: yes
  tags: [update]

- name: Remove unused packages
  apt:
    autoremove: yes
    autoclean: yes
  tags: [update]

- name: Check if reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required
  tags: [update]

- name: Notify if reboot is needed
  debug:
    msg: "⚠️  Reboot is required on {{ inventory_hostname }}"
  when: reboot_required.stat.exists
  tags: [update]

- name: Install Chrony (NTP)
  apt:
    name: chrony
    state: present
  tags: [ntp, setup]

- name: Configure NTP Server
  lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool '
    line: "pool 0.no.pool.ntp.org iburst"
    backup: yes
  notify: Restart Chrony
  tags: [ntp, setup]

- name: Ensure Chrony is enabled and running
  service:
    name: chrony
    state: started
    enabled: yes
  tags: [ntp, setup]

- name: Set system timezone to Europe/Oslo
  community.general.timezone:
    name: Europe/Oslo
  become: true

- name: Create fail2ban jail.local for SSH
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5
      
      [sshd]
      enabled = true
      port = 22
      logpath = %(sshd_log)s
      backend = %(sshd_backend)s
    mode: '0644'
  notify: Restart Fail2Ban


- name: Allow Common Ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ common_ports }}"

- name: Ensure Fail2Ban is running
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: Enable UFW Firewall
  community.general.ufw:
    state: enabled

# A kernel oops can leave a host hung indefinitely (pve-wazuh sat dead for ~21h
# after a virtio oops); panic on it and reboot after 10s so it recovers itself.
# VMs only: an oops on a Proxmox node shouldn't silently reboot a Ceph node.
- name: Reboot automatically after a kernel oops
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-panic.conf
    mode: '0644'
    content: |
      kernel.panic_on_oops = 1
      kernel.panic = 10
  register: panic_sysctl
  when: "'proxmox_hosts' not in group_names"

- name: Apply panic sysctl settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-panic.conf
  when: "'proxmox_hosts' not in group_names and panic_sysctl.changed"
  changed_when: true

# Undo the above if an earlier run put it on a Proxmox node (the sysctl values
# stay loaded until the next reboot, so reset them now too).
- name: Remove the oops-reboot setting from Proxmox nodes
  ansible.builtin.file:
    path: /etc/sysctl.d/90-panic.conf
    state: absent
  register: panic_sysctl_removed
  when: "'proxmox_hosts' in group_names"

- name: Reset panic sysctl values on Proxmox nodes
  ansible.builtin.command: sysctl -w kernel.panic_on_oops=0 kernel.panic=0
  when: "'proxmox_hosts' in group_names and panic_sysctl_removed.changed"
  changed_when: true

# Journals have no size cap by default. mini_pc sets its own, much smaller, cap
# (log2ram is only 128M), so leave those hosts to that role.
- name: Cap journald disk usage
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?SystemMaxUse='
    line: 'SystemMaxUse=1G'
  when: "'mini_pc' not in group_names"
  notify: Restart journald

# The VMs have no vsock device, so systemd-ssh-generator logs "Failed to query
# local AF_VSOCK CID" on the console at every daemon-reload. Harmless; mask it.
- name: Ensure systemd system-generators override dir exists
  ansible.builtin.file:
    path: /etc/systemd/system-generators
    state: directory
    mode: '0755'

- name: Mask systemd-ssh-generator (silences AF_VSOCK console noise)
  ansible.builtin.file:
    src: /dev/null
    dest: /etc/systemd/system-generators/systemd-ssh-generator
    state: link