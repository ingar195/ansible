---
nfs_gateway_ports:
  - { port: '2049', proto: 'tcp', comment: 'NFS' }

ceph_mon_hosts:
  - 10.11.0.11
  - 10.11.0.12
  - 10.11.0.13
cephfs_name: shared-data

# One entry per exported subdirectory. `clients` restricts the export to
# specific host IPs — a host not listed here cannot mount that export at all.
# Example:
# nfs_exports:
#   - export_id: 10
#     pseudo_path: /komodo-manager
#     cephfs_path: /komodo-manager
#     clients: ["10.11.0.51"]
nfs_exports: []

# nfs-ganesha has a known failure mode where its worker threads stall while
# systemd still reports the unit as active - it logs "Health status is
# unhealthy" on its own heartbeat when this happens. These control the
# watchdog timer that restarts it when that's been seen repeatedly.
ganesha_health_check_interval: "5min"
ganesha_health_window_seconds: 300
ganesha_health_threshold: 3

# Ganesha can also hold a stale libcephfs session while its heartbeat still
# reports healthy. The healthcheck catches that by mounting one export over
# NFS on localhost and statting it. All exports share Ganesha's single
# libcephfs session, so probing one is enough. Empty = probe disabled.
ganesha_health_probe_export: "{{ nfs_exports[0].pseudo_path if nfs_exports else '' }}"
ganesha_health_probe_timeout: 15
# Skip all checks this long after Ganesha (re)starts - see the script.
ganesha_health_startup_grace_seconds: 600
