[defaults]
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/fact_cache
fact_caching_timeout = 3600
callbacks_enabled = profile_tasks
# Hosts get rebuilt often (new VMs, same IP), so don't stop on unknown or changed
# keys. Trade-off: no protection against a spoofed host on the LAN.
host_key_checking = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
